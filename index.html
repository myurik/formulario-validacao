<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário de Cadastro</title>
</head>
<body>
<main>
    <form id="form-cadastro" action="">
        <h1>Crie sua Conta</h1>
        <div class="campo campo-foto">
            <label for="foto">Foto do Perfil (opcional)</label>
            <div class="preview-foto" id="preview-foto">

            </div>
            <input type="file" id="foto" name="foto" accept="image/*" capture="user">
        </div>
        <div class="campo campo-nome">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu Nome Completo">
            <span class="erro" id="erro-nome"></span>
        </div>
        <div class="campo campo-email">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            <span class="erro" id="erro-email"></span>
        </div>
        <div class="campo campo-cpf">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
            <span class="erro" id="erro-cpf"></span>
        </div>
        <div class="campo campo-telefone">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
            <span class="erro" id="erro-telefone"></span>
        </div>
        <div class="campo campo-data-nascimento">
            <label for="data-nascimento">Data de Nascimento</label>
            <input type="date" id="data-nascimento" name="data-nascimento">
            <span class="erro" id="erro-data-nascimento"></span>
        </div>
        <div class="campo campo-senha">
            <label for="senha">Senha</label>
            <div class="input-com-icone">
                <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres">
                <button type="button" class="btn-toggle-senha" id="toggle-senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <span class="erro" id="erro-senha"></span>
        </div>
        <div class="campo campo-confirmar-senha">
            <label for="confirmar-senha">Confirmar Senha</label>
            <div class="input-com-icone">
                <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita sua Senha">
                <button type="button" class="btn-toggle-senha" id="toggle-confirmar-senha">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <span class="erro" id="erro-confirmar-senha"></span>
        </div>
        <div class="campo campo-termos">
            <div class="checkbox-grupo">
                <input type="checkbox" id="termos" name="termos">
                <label for="termos">Li e aceito os <a href="#">Termos de Uso</a></label>
            </div>
            <span class="erro" id="erro-termos"></span>
        </div>
        <button type="submit" id="btn-cadastrar">Criar Conta</button>
    </form>
</main>
</body>
</html>
